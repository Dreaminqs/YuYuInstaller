<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>YuYuInstaller Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    body {
      width: 330px;
      background: linear-gradient(155deg, #090d16 0%, #101829 100%);
      color: #f3f4f6;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }
    .brand-sub {
      font-size: 10px;
      font-weight: 600;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
    .status-badge.online {
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.45);
      color: #10b981;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
    }
    .status-badge.online .dot {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .page-card {
      background: rgba(15, 20, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      padding: 11px 12px;
      margin-bottom: 12px;
    }
    .page-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 11px;
      color: #7c8799;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      height: 38px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.16s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: linear-gradient(90deg, #38bdf8 0%, #2563eb 100%);
      color: #070a12;
      font-weight: 700;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
    }
    .btn-ghost:hover {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.45);
      color: #38bdf8;
    }
    .toast {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #38bdf8;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="YuYu">
      <div>
        <div class="brand-title">YuYuInstaller</div>
        <div class="brand-sub">v1.2.7 Pro Companion</div>
      </div>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="dot"></span>
      <span id="statusText">Kontrol...</span>
    </div>
  </div>

  <div class="page-card">
    <div id="pageTitle" class="page-title">Sekme Yükleniyor...</div>
    <div id="pageUrl" class="page-url">https://...</div>
  </div>

  <div class="actions">
    <button id="btnAnalyze" class="btn btn-primary">
      <span>Analiz Et (Kalite / Bölüm Seç)</span>
    </button>
    <button id="btnQuickDownload" class="btn btn-ghost">
      <span>Hemen İndir (En Yüksek Kalite)</span>
    </button>
  </div>

  <div id="toastMsg" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
